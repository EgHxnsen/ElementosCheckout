<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O único programa — Lushé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,500&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --page:      #EDE7E0;
      --ink:       oklch(0.265 0.012 55);
      --ink-soft:  oklch(0.46 0.012 55);
      --ink-faint: oklch(0.62 0.01 60);
      --line-2:    oklch(0.86 0.01 60);
      --clay-d:    oklch(0.55 0.1 30);
    }

    html, body { background: var(--page); }
    body {
      font-family: 'Schibsted Grotesk', -apple-system, system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    .module {
      max-width: 460px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--clay-d);
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--line-2);
    }

    h1 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-weight: 400;
      font-size: clamp(25px, 7.2vw, 30px);
      line-height: 1.18;
      letter-spacing: -0.012em;
      color: var(--ink);
      margin: 12px auto 0;
      max-width: 16ch;
    }
    h1 em {
      display: block;
      font-style: italic;
      color: var(--clay-d);
      font-weight: 500;
      margin-top: 4px;
    }

    .lede {
      margin: 16px auto 0;
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.6;
      max-width: 36ch;
    }
    .lede .accent {
      font-style: italic;
      color: var(--clay-d);
      font-weight: 500;
    }

    @media (max-width: 360px) {
      .module { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <section class="module">
    <span class="eyebrow">Sua promessa</span>
    <h1>O único programa que você precisa para <em>suavizar as rugas e sentir-se mais jovem</em></h1>
    <p class="lede">Além de recuperar a sua autoestima, em poucos dias vai sentir a sua pele <span class="accent">mais iluminada, firme e jovem</span>.</p>
  </section>
</body>
</html>
