<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quanto tempo por dia — Lushé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,500&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --page:      #EDE7E0;
      --ink:       oklch(0.265 0.012 55);
      --ink-soft:  oklch(0.46 0.012 55);
      --ink-faint: oklch(0.62 0.01 60);
      --line-2:    oklch(0.86 0.01 60);
      --clay-d:    oklch(0.55 0.1 30);
    }

    html, body { background: var(--page); }
    body {
      font-family: 'Schibsted Grotesk', -apple-system, system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .module {
      max-width: 460px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--clay-d);
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--line-2);
    }

    h1 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-weight: 400;
      font-size: clamp(26px, 7.6vw, 32px);
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-top: 12px;
      max-width: 14ch;
      margin-left: auto;
      margin-right: auto;
    }
    h1 em { font-style: italic; color: var(--clay-d); font-weight: 500; }

    .caption {
      margin-top: 12px;
      font-size: 13px;
      color: var(--ink-faint);
      font-style: italic;
      line-height: 1.55;
      max-width: 32ch;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 360px) {
      .module { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <section class="module">
    <span class="eyebrow">Sua rotina</span>
    <h1>Quanto tempo por <em>dia</em> você consegue dedicar ao cuidado da sua pele?</h1>
    <p class="caption">Seu plano será ajustado para caber na sua rotina.</p>
  </section>
</body>
</html>
