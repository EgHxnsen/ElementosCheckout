<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depoimento — Lushé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,500&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --page:      #EDE7E0;
      --surface:   oklch(0.987 0.004 75);
      --surface-2: oklch(0.965 0.006 70);
      --ink:       oklch(0.265 0.012 55);
      --ink-soft:  oklch(0.46 0.012 55);
      --ink-faint: oklch(0.62 0.01 60);
      --line:      oklch(0.905 0.008 65);
      --line-2:    oklch(0.86 0.01 60);
      --clay:      oklch(0.64 0.095 32);
      --clay-d:    oklch(0.55 0.1 30);
      --clay-wash: oklch(0.955 0.018 40);
    }

    html, body { background: var(--page); }
    body {
      font-family: 'Schibsted Grotesk', -apple-system, system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    .module {
      max-width: 460px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ─── HEADING ─── */
    h2 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-weight: 400;
      font-size: clamp(22px, 6.4vw, 26px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
      color: var(--ink);
      max-width: 18ch;
      margin: 0 auto;
    }
    h2 em {
      display: block;
      font-style: italic;
      color: var(--clay-d);
      font-weight: 500;
      margin-top: 4px;
    }

    /* ─── CARD ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 20px 18px;
      margin-top: 18px;
      position: relative;
    }

    .quote-mark {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-size: 56px;
      line-height: 1;
      color: var(--clay-wash);
      user-select: none;
      pointer-events: none;
    }

    .stars {
      display: flex;
      gap: 3px;
      color: var(--clay);
      margin-bottom: 12px;
    }
    .stars svg { width: 14px; height: 14px; }

    .quote {
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      letter-spacing: -0.003em;
    }
    .quote .heart {
      display: inline-block;
      width: 14px; height: 14px;
      color: var(--clay);
      vertical-align: -2px;
      margin-left: 2px;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--clay-wash);
      color: var(--clay-d);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .author-info { font-size: 13px; color: var(--ink-soft); }
    .author-info b { color: var(--ink); font-weight: 600; }
    .author-info .meta {
      font-size: 11.5px;
      color: var(--ink-faint);
      letter-spacing: 0.01em;
      margin-top: 1px;
    }

    @media (max-width: 360px) {
      .module { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <section class="module">
    <h2>Uma pele firme e jovem ficou mais fácil com o <em>Botox Coreano</em></h2>

    <article class="card">
      <span class="quote-mark" aria-hidden="true">&ldquo;</span>

      <div class="stars" aria-label="5 de 5 estrelas">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 18l-6.4 3.2L7 14.2l-5-4.8 7-.9z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 18l-6.4 3.2L7 14.2l-5-4.8 7-.9z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 18l-6.4 3.2L7 14.2l-5-4.8 7-.9z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 18l-6.4 3.2L7 14.2l-5-4.8 7-.9z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5 4.8 1.2 7L12 18l-6.4 3.2L7 14.2l-5-4.8 7-.9z"/></svg>
      </div>

      <p class="quote">
        Foram só 3 semanas fazendo o Botox Coreano natural e parece que voltei a ter 30 anos. O melhor é que faço em dois minutinhos, adorei o resultado
        <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7-4.35-9.5-9C.4 7.5 3.5 3 7.5 3c2.1 0 3.6 1.2 4.5 2.5C12.9 4.2 14.4 3 16.5 3 20.5 3 23.6 7.5 21.5 12 19 16.65 12 21 12 21z"/></svg>
      </p>

      <div class="author">
        <span class="avatar" aria-hidden="true">M</span>
        <div class="author-info">
          <b>Marina</b>
          <div class="meta">44 anos · Protocolo 3 Meses</div>
        </div>
      </div>
    </article>
  </section>
</body>
</html>
